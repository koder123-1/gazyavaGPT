# Не даём бесплатному инстансу Render заснуть в часы, когда ботом пользуются.
# Render free выключает сервис после 15 минут без входящего трафика, а его
# собственные health-check'и спину не мешают. Пинг раз в 10 минут держит
# сервис живым; ночью (21:00-03:00 UTC) он спит, чтобы не тратить лимит
# 750 инстанс-часов в месяц. Пропущенные за это время сообщения не теряются:
# webhook их доставит после пробуждения (drop_pending_updates=False).
name: keep-alive

on:
  schedule:
    - cron: "*/10 3-20 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 40 --retry 2 --retry-delay 5 \
            https://gazyava-gpt.onrender.com/health