name: keepalive

on:
  schedule:
    # Render free засыпает после 15 минут без трафика.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: curl -fsS --max-time 60 --retry 2 https://gazyava-gpt.onrender.com/health